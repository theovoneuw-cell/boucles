# Toutes les 6 heures, le robot passe sur Ultimate Guitar et La Boîte à chansons,
# convertit les nouveaux morceaux de rap français en grilles et publie data-auto.json.
# Le bouton ↻ de l'app va chercher ce fichier. Lancement manuel : onglet Actions → Collecte → Run workflow.
name: Collecte

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les nouveaux morceaux
        run: python3 build/collect.py --max 120
      - name: Convertir en grilles
        run: node build/merge.js
      - name: Publier
        run: |
          git config user.name "boucles-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-auto.json build/rejets.json build/file.json
          if git diff --cached --quiet; then echo "Rien de neuf."; exit 0; fi
          git commit -m "Catalogue : nouveaux morceaux du $(date +%d/%m/%Y)"
          git push
