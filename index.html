<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boucles</title>
<meta name="description" content="Répertoire de rap français en accords grattés pour s'exercer à la guitare.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boucles">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root {
  --bg: #F6F5F2; --fg: #171716; --muted: #6E6C67; --line: #E1DFD9; --soft: #ECEAE5;
  --accent: #2C5BD0; --on-accent: #fff; --accent-soft: rgba(44, 91, 208, .1);
  --sans: 'Geist', -apple-system, system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
  --gut: 16px; --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --fg: #ECEBE7; --muted: #8D8B86; --line: #2A2A28; --soft: #1D1D1C;
    --accent: #7298F2; --on-accent: #0E1424; --accent-soft: rgba(114, 152, 242, .14); color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
#app { max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top, 0px) var(--gut) calc(140px + var(--safe-b)); }
.muted { color: var(--muted); font-weight: 400; }

/* répertoire */
.top { padding: 28px 0 14px; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; margin: 0; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.tools { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 10px;
  margin: 0 calc(-1 * var(--gut)); padding-left: var(--gut); padding-right: var(--gut);
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--soft); }
.search svg { width: 17px; height: 17px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--fg); font: 400 16px var(--sans); -webkit-appearance: none; }
.search input::placeholder { color: var(--muted); }
.seg { display: flex; margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { flex: 1; height: 32px; border-radius: 7px; font-size: 14px; color: var(--muted); white-space: nowrap; padding: 0 8px; }
.seg button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.seg.small { margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.seg.small::-webkit-scrollbar { display: none; }
.seg.small button { height: 30px; font-size: 13.5px; flex: 1 0 auto; }

.list { padding-bottom: 20px; }
.artist { font-size: 13px; font-weight: 500; color: var(--muted); margin: 22px 0 2px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--line); min-height: 48px; }
.row:active { opacity: .55; }
.tt { font-size: 17px; font-weight: 500; min-width: 0; }
.star { font-style: normal; color: var(--accent); font-size: 13px; }
.ch { font: 400 13px var(--mono); color: var(--muted); white-space: nowrap; text-align: right; flex: none; max-width: 52%; overflow: hidden; text-overflow: ellipsis; }
.ch em { font: 400 12px var(--sans); font-style: normal; display: block; margin-top: 2px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* morceau */
.bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between;
  height: calc(48px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  margin: calc(-1 * env(safe-area-inset-top, 0px)) calc(-1 * var(--gut)) 0; padding-left: 6px; padding-right: 6px;
  background: var(--bg); border-bottom: 1px solid var(--line); }
.back { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 10px 0 4px; font-size: 16px; color: var(--accent); }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fav { width: 44px; height: 44px; display: grid; place-items: center; }
.fav svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; }
.fav[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
.song { padding: 20px 0 16px; }
.song h1 { font-size: 28px; }

.ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 0 16px; border-top: 1px solid var(--line); }
.stepper { display: flex; align-items: center; height: 44px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper .lab { font-size: 12.5px; color: var(--muted); padding-left: 10px; width: 60px; flex: none; }
.stepper button { width: 38px; height: 100%; font-size: 21px; font-weight: 300; flex: none; }
.stepper button:active { background: var(--soft); }
.stepper output { flex: 1; text-align: center; font: 500 15px var(--mono); }
.key { grid-column: 1 / -1; margin: 0; font-size: 14px; }
.mono { font-family: var(--mono); }
.opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.tog { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; }
.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tog.ghost { color: var(--muted); }
.tog:active { opacity: .6; }

.block { border-top: 1px solid var(--line); padding: 14px 0 18px; }
.block > h2, .sec h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
.chords { display: flex; gap: 4px; overflow-x: auto; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut); scrollbar-width: none; }
.chords::-webkit-scrollbar { display: none; }
.chord { flex: none; width: 74px; padding: 6px 2px 2px; border-radius: 10px; text-align: center; }
.chord b { display: block; font: 500 15px var(--mono); margin-bottom: 2px; }
.chord svg { width: 70px; margin: 0 auto; }
.chord.hit { animation: hit .5s ease-out; }
@keyframes hit { from { background: var(--accent-soft); } to { background: transparent; } }
.st { stroke: var(--muted); stroke-width: .8; }
.fl { stroke: var(--line); stroke-width: 1; }
@media (prefers-color-scheme: light) { .fl { stroke: #CFCCC4; } }
.nut { fill: var(--fg); }
.dot { fill: var(--fg); }
.op { fill: none; stroke: var(--fg); stroke-width: 1.1; }
.mk { font: 400 9px var(--sans); fill: var(--muted); }
.fr { font: 500 8.5px var(--mono); fill: var(--muted); }

.rhythm { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step { display: flex; flex-direction: column; align-items: center; padding: 8px 0 6px; border-left: 1px solid var(--line); transition: background .08s; }
.step:first-child { border-left: 0; }
.step:nth-child(3), .step:nth-child(5), .step:nth-child(7) { border-left-color: var(--muted); }
.step .g { height: 28px; }
.step svg { width: 18px; height: 28px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.step .c { font: 400 11.5px var(--mono); color: var(--muted); margin-top: 4px; }
.step.off .c { opacity: .7; }
.step.cur { background: var(--accent-soft); }
.step.cur svg { stroke: var(--accent); }
.guide { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.guide > span { font-size: 13px; color: var(--muted); flex: none; }
.guide .seg { margin-top: 0; flex: 1; }
#rsel { display: grid; grid-template-columns: repeat(3, 1fr); }

.sec { padding: 4px 0 14px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 16px; }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); border-left: 1px solid var(--fg); }
.m { position: relative; height: 54px; display: flex; align-items: center; justify-content: center; gap: 0;
  border-right: 1px solid var(--fg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font: 500 17px var(--mono); transition: background .1s; }
.bars .m:nth-child(4n+1) { box-shadow: -1px 0 0 var(--fg); }
.m span { flex: 1; text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.m.two { font-size: 14.5px; }
.m.two span + span { border-left: 1px dashed var(--line); }
.m.cur { background: var(--accent); color: var(--on-accent); }
.m.cur.two span + span { border-left-color: transparent; }
.m:active { background: var(--soft); }
.reps { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; text-align: right; }
.note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin: 0; }

/* lecteur */
.play { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px var(--gut) calc(10px + var(--safe-b)); }
.play > * { max-width: 528px; margin-left: auto; margin-right: auto; }
.now { display: none; align-items: baseline; gap: 12px; height: 44px; }
.play.on .now { display: flex; }
.now b { font: 600 34px/1 var(--mono); letter-spacing: -.02em; min-width: 64px; }
.now span:not(.mini) { font: 400 16px var(--mono); flex: 1; }
.mini { display: flex; align-self: center; font: 500 15px/1 var(--mono); }
.mini i { font-style: normal; width: 17px; height: 24px; display: grid; place-items: center; color: var(--muted); border-radius: 4px; }
.mini i:nth-child(odd) { color: var(--fg); }
.mini i.on { background: var(--accent); color: var(--on-accent); }
.ctrls { display: flex; align-items: center; gap: 10px; }
.go { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--fg); flex: none; }
.go svg { width: 18px; height: 18px; fill: var(--bg); }
.play.on .go { background: var(--accent); }
.play.on .go svg { fill: var(--on-accent); }
.tempo { flex: 1; min-width: 0; }
.tempo output small { font: 400 12px var(--sans); color: var(--muted); }
.loop { flex: none; height: 44px; font-size: 13.5px; max-width: 108px; line-height: 1.15; }
@media (max-width: 360px) { .loop { max-width: 92px; font-size: 12.5px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
